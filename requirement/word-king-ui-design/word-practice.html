<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词练习 - Word King</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="stylesheet" href="css/common.css">
    <style>
        body {
            overflow: hidden;
        }

        .page-header {
            background-color: var(--bg-primary);
            padding: 32px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .page-subtitle {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .main-content {
            padding: 0;
            overflow: hidden;
        }

        .practice-modes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .mode-card {
            background-color: var(--bg-primary);
            border-radius: var(--radius-lg);
            padding: 24px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .mode-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-4px);
        }

        .mode-card.active {
            border-color: var(--primary-color);
            background-color: #EFF6FF;
        }

        .mode-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .mode-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .mode-desc {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .practice-area {
            background-color: var(--bg-primary);
            padding: 40px 20px;
            min-height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .practice-header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .practice-progress {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .progress-text {
            font-size: 16px;
            color: var(--text-secondary);
        }

        .progress-bar {
            width: 200px;
            height: 8px;
            background-color: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }

        .score-display {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
            color: var(--success-color);
        }

        .question-area {
            text-align: center;
            margin-bottom: 40px;
        }

        .question-label {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-word {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: flex;
            gap: 0;
            justify-content: center;
            flex-wrap: wrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .question-word:hover {
            opacity: 0.8;
        }

        .question-word .word-letter {
            display: inline-block;
            padding: 0;
            transition: all 0.2s ease;
            color: var(--text-primary);
            background-color: transparent;
        }

        .question-word .word-letter.correct {
            color: var(--success-color);
            background-color: rgba(52, 199, 89, 0.1);
        }

        .question-word .word-letter.incorrect {
            color: var(--danger-color);
            background-color: rgba(255, 59, 48, 0.1);
            animation: shake 0.3s ease;
        }

        .question-word .word-letter.active {
            color: var(--primary-color);
        }

        .question-phonetic {
            font-size: 18px;
            color: var(--text-light);
        }

        .answer-area {
            margin-bottom: 32px;
        }

        .answer-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 20px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            text-align: center;
            transition: border-color 0.3s ease;
            letter-spacing: 0.5em;
        }

        .answer-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .answer-input.correct {
            border-color: var(--success-color);
            background-color: #D1FAE5;
        }

        .answer-input.incorrect {
            border-color: var(--danger-color);
            background-color: #FEE2E2;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .question-meaning {
            font-size: 18px;
            color: var(--text-secondary);
            margin-top: 12px;
            font-weight: 500;
        }

        .question-phonetic-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .sound-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s ease;
            color: var(--primary-color);
        }

        .sound-btn:hover {
            background-color: var(--bg-tertiary);
            transform: scale(1.1);
        }

        .sound-btn:active {
            transform: scale(0.95);
        }

        .feedback-area {
            text-align: center;
            padding: 20px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            display: none;
        }

        .feedback-area.show {
            display: block;
        }

        .feedback-area.success {
            background-color: #D1FAE5;
            color: #065F46;
        }

        .feedback-area.error {
            background-color: #FEE2E2;
            color: #991B1B;
        }

        .feedback-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .feedback-detail {
            font-size: 14px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .option-btn {
            padding: 16px 24px;
            font-size: 16px;
            background-color: var(--bg-tertiary);
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .option-btn:hover {
            background-color: var(--border-color);
        }

        .option-btn.selected {
            border-color: var(--primary-color);
            background-color: #EFF6FF;
        }

        .option-btn.correct {
            border-color: var(--success-color);
            background-color: #D1FAE5;
        }

        .option-btn.incorrect {
            border-color: var(--danger-color);
            background-color: #FEE2E2;
        }

        .action-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .stats-area {
            background-color: var(--bg-primary);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-md);
            max-width: 800px;
            margin: 40px auto 0;
        }

        .stats-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
            text-align: center;
            color: var(--text-primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 24px;
        }

        .stat-item {
            text-align: center;
            padding: 20px;
            background-color: var(--bg-secondary);
            border-radius: var(--radius-md);
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .welcome-area {
            text-align: center;
            padding: 60px 20px;
        }

        .welcome-icon {
            font-size: 80px;
            margin-bottom: 24px;
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .welcome-desc {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .pause-overlay {
            position: fixed;
            top: 70px;
            left: 0;
            width: 100%;
            height: calc(100% - 70px);
            background-color: rgba(242, 237, 237, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .pause-content {
            text-align: center;
            color: var(--text-white);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
        }

        .pause-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .pause-desc {
            font-size: 18px;
            opacity: 0.9;
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: var(--radius-full);
            transition: all 0.2s ease;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 24px;
            }

            .practice-modes {
                grid-template-columns: 1fr;
            }

            .practice-area {
                padding: 24px;
            }

            .question-word {
                font-size: 28px;
            }

            .options-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="bg-primary" style="background-color: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-light); position: sticky; top: 0; z-index: 100;">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; height: 64px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <img src="assets/logo.svg" alt="Word King Logo" style="width: 40px; height: 40px;">
                    <a href="index.html" style="font-size: 24px; font-weight: 700; color: var(--primary-color); text-decoration: none;">Word King</a>
                </div>
                <div style="display: flex; align-items: center; gap: 4px;">
                    <div class="nav">
                        <a href="word-management.html" class="nav-link">单词管理</a>
                        <a href="article-management.html" class="nav-link">文章管理</a>
                        <a href="word-practice.html" class="nav-link active">单词练习</a>
                        <a href="article-reading.html" class="nav-link">文章阅读</a>
                    </div>
                    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
                        <svg width="20" height="20" id="themeIcon"><use href="assets/icons.svg#icon-moon"></use></svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content">
        <div class="container">
            <!-- 暂停蒙版 -->
            <div class="pause-overlay" id="pauseArea" style="display: none;">
                <div class="pause-content">
                    <p class="pause-desc">按任意键继续练习</p>
                </div>
            </div>

            <!-- 练习区域 -->
            <div class="practice-area" id="practiceArea">
                <div class="practice-header">
                    <div class="practice-progress">
                        <span class="progress-text">进度: 1/10</span>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 10%;"></div>
                        </div>
                    </div>
                    <div class="score-display">
                                        <svg width="18" height="18"><use href="assets/icons.svg#icon-star"></use></svg>
                                        <span>得分: 80</span>
                                    </div>                </div>

                <!-- 拼写练习模式 -->
                <div id="spellingMode">
                    <div class="question-area">
                        <div class="question-word" id="currentWord" onclick="startPractice()">serendipity</div>
                        <div class="question-phonetic-container">
                            <button class="sound-btn" id="playSoundBtn" onclick="playWordSound()">
                                <svg width="20" height="20"><use href="assets/icons.svg#icon-speaker"></use></svg>
                            </button>
                            <span class="question-phonetic" id="currentPhonetic">/ˌserənˈdɪpəti/</span>
                        </div>
                        <div class="question-meaning" id="currentMeaning">n. 意外发现珍奇事物的本领</div>
                    </div>
                    <div class="feedback-area" id="feedbackArea">
                        <div class="feedback-text" id="feedbackText"></div>
                    </div>
                </div>

                <!-- 释义测试模式 -->
                <div id="meaningMode" style="display: none;">
                    <div class="question-area">
                        <div class="question-label">选择正确的释义</div>
                        <div class="question-word">epiphany</div>
                        <div class="question-phonetic">/ɪˈpɪfəni/</div>
                    </div>
                    <div class="options-grid">
                        <button class="option-btn" onclick="selectOption(this)">A. 一种宗教仪式</button>
                        <button class="option-btn" onclick="selectOption(this)">B. 顿悟；突然的领悟</button>
                        <button class="option-btn" onclick="selectOption(this)">C. 持续的痛苦</button>
                        <button class="option-btn" onclick="selectOption(this)">D. 美好的回忆</button>
                    </div>
                    <div class="feedback-area" id="feedbackArea2">
                        <div class="feedback-text">回答正确！</div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-outline" onclick="skipQuestion()">跳过</button>
                        <button class="btn btn-primary" onclick="checkMeaning()">确认选择</button>
                    </div>
                </div>
            </div>

            <!-- 统计区域 -->
            <div class="stats-area" id="statsArea" style="display: none;">
                <h2 class="stats-title">练习完成！</h2>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value">8</div>
                        <div class="stat-label">正确</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" style="color: var(--danger-color);">2</div>
                        <div class="stat-label">错误</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" style="color: var(--warning-color);">80%</div>
                        <div class="stat-label">正确率</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" style="color: var(--success-color);">80</div>
                        <div class="stat-label">总得分</div>
                    </div>
                </div>
                <div style="text-align: center; margin-top: 32px;">
                    <button class="btn btn-outline" onclick="reviewMistakes()">查看错题</button>
                    <button class="btn btn-primary" onclick="restartPractice()">再次练习</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 单词数据
        const wordList = [
            { word: 'serendipity', phonetic: '/ˌserənˈdɪpəti/', meaning: 'n. 意外发现珍奇事物的本领' },
            { word: 'epiphany', phonetic: '/ɪˈpɪfəni/', meaning: 'n. 顿悟；突然的领悟' },
            { word: 'ubiquitous', phonetic: '/juːˈbɪkwɪtəs/', meaning: 'adj. 无所不在的' },
            { word: 'ephemeral', phonetic: '/ɪˈfemərəl/', meaning: 'adj. 短暂的，转瞬即逝的' },
            { word: 'serene', phonetic: '/səˈriːn/', meaning: 'adj. 宁静的，安详的' },
            { word: 'resilient', phonetic: '/rɪˈzɪliənt/', meaning: 'adj. 有弹性的，能恢复的' },
            { word: 'eloquent', phonetic: '/ˈeləkwənt/', meaning: 'adj. 雄辩的，有说服力的' },
            { word: 'meticulous', phonetic: '/məˈtɪkjələs/', meaning: 'adj. 一丝不苟的，细致的' },
            { word: 'pragmatic', phonetic: '/præɡˈmætɪk/', meaning: 'adj. 务实的，实用的' },
            { word: 'ambiguous', phonetic: '/æmˈbɪɡjuəs/', meaning: 'adj. 模糊不清的，模棱两可的' }
        ];

        let currentMode = 'spelling';
        let selectedOption = null;
        let currentWordIndex = 0;
        let score = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let mistakes = [];
        let isPaused = false;
        let isStarted = false;
        let currentInput = '';

        // 切换主题
        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                themeIcon.innerHTML = '<use href="assets/icons.svg#icon-moon"></use>';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                themeIcon.innerHTML = '<use href="assets/icons.svg#icon-sun"></use>';
                localStorage.setItem('theme', 'dark');
            }
        }

        function selectMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-card').forEach(card => {
                card.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
        }

        function startPractice() {
            document.getElementById('pauseArea').style.display = 'none';
            document.getElementById('statsArea').style.display = 'none';
            isStarted = true;
            isPaused = false;

            if (currentMode === 'meaning') {
                document.getElementById('spellingMode').style.display = 'none';
                document.getElementById('meaningMode').style.display = 'block';
            } else {
                document.getElementById('spellingMode').style.display = 'block';
                document.getElementById('meaningMode').style.display = 'none';
                loadWord();
            }
        }

        function loadWord() {
            const wordData = wordList[currentWordIndex];
            const currentWordEl = document.getElementById('currentWord');

            // 创建字母元素
            currentWordEl.innerHTML = '';
            for (let i = 0; i < wordData.word.length; i++) {
                const letter = document.createElement('span');
                letter.className = 'word-letter';
                letter.textContent = wordData.word[i];
                letter.dataset.index = i;
                currentWordEl.appendChild(letter);
            }

            document.getElementById('currentPhonetic').textContent = wordData.phonetic;
            document.getElementById('currentMeaning').textContent = wordData.meaning;

            // 设置第一个字母为活动状态
            const firstLetter = currentWordEl.querySelector('.word-letter');
            if (firstLetter) {
                firstLetter.classList.add('active');
            }

            // 重置输入
            currentInput = '';

            // 隐藏反馈
            const feedback = document.getElementById('feedbackArea');
            feedback.classList.remove('show', 'success', 'error');

            // 更新进度
            updateProgress();

            // 默认播放发音
            playWordSound();
        }

        function updateProgress() {
            const progressText = document.querySelector('.progress-text');
            const progressFill = document.querySelector('.progress-fill');
            const scoreDisplay = document.querySelector('.score-display span:last-child');

            progressText.textContent = `进度: ${currentWordIndex + 1}/${wordList.length}`;
            progressFill.style.width = `${((currentWordIndex + 1) / wordList.length) * 100}%`;
            scoreDisplay.textContent = `得分: ${score}`;
        }

        function checkAnswer() {
            const feedback = document.getElementById('feedbackArea');
            const feedbackText = document.getElementById('feedbackText');
            const wordData = wordList[currentWordIndex];
            const userInput = currentInput.toLowerCase();
            const currentWordEl = document.getElementById('currentWord');

            if (userInput === wordData.word.toLowerCase()) {
                // 正确
                feedback.classList.add('show', 'success');
                feedbackText.textContent = '✓ 回答正确！';
                score += 10;
                correctCount++;

                // 更新字母显示
                const letters = currentWordEl.querySelectorAll('.word-letter');
                letters.forEach((letter, index) => {
                    letter.classList.add('correct');
                    letter.classList.remove('active');
                });

                // 延迟后进入下一个单词
                setTimeout(() => {
                    nextWord();
                }, 1000);
            } else {
                // 错误 - 清空重新输入
                feedback.classList.add('show', 'error');
                feedbackText.textContent = '✗ 拼写错误，请重试';

                // 震动效果
                const letters = currentWordEl.querySelectorAll('.word-letter');
                letters.forEach((letter, index) => {
                    if (index < currentInput.length) {
                        if (currentInput[index] === wordData.word[index]) {
                            letter.classList.add('correct');
                        } else {
                            letter.classList.add('incorrect');
                        }
                    }
                });

                // 记录错误
                mistakes.push({
                    word: wordData.word,
                    userInput: userInput,
                    index: currentWordIndex
                });

                // 清空输入，从第一个字母重新输入
                setTimeout(() => {
                    currentInput = '';
                    const letters = currentWordEl.querySelectorAll('.word-letter');
                    letters.forEach(letter => {
                        letter.classList.remove('incorrect', 'correct', 'active');
                    });
                    // 重新设置第一个字母为活动状态
                    const firstLetter = currentWordEl.querySelector('.word-letter');
                    if (firstLetter) {
                        firstLetter.classList.add('active');
                    }
                    feedback.classList.remove('show', 'error');
                }, 500);
            }
        }

        function nextWord() {
            currentWordIndex++;
            if (currentWordIndex >= wordList.length) {
                showStats();
            } else {
                loadWord();
            }
        }

        function playWordSound() {
            const wordData = wordList[currentWordIndex];
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(wordData.word);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            }
        }

        function showStats() {
            document.getElementById('spellingMode').style.display = 'none';
            document.getElementById('meaningMode').style.display = 'none';
            document.getElementById('statsArea').style.display = 'block';

            const correctRate = wordList.length > 0 ? Math.round((correctCount / wordList.length) * 100) : 0;

            document.querySelector('.stat-item:nth-child(1) .stat-value').textContent = correctCount;
            document.querySelector('.stat-item:nth-child(2) .stat-value').textContent = mistakes.length;
            document.querySelector('.stat-item:nth-child(3) .stat-value').textContent = correctRate + '%';
            document.querySelector('.stat-item:nth-child(4) .stat-value').textContent = score;
        }

        function reviewMistakes() {
            if (mistakes.length === 0) {
                alert('没有错题，太棒了！');
                return;
            }

            let mistakesText = '错题列表：\n\n';
            mistakes.forEach((mistake, index) => {
                mistakesText += `${index + 1}. ${mistake.word} (你的回答: ${mistake.userInput})\n`;
            });
            alert(mistakesText);
        }

        function restartPractice() {
            currentWordIndex = 0;
            score = 0;
            correctCount = 0;
            mistakes = [];
            isStarted = false;
            isPaused = false;
            currentInput = '';

            document.getElementById('pauseArea').style.display = 'none';
            document.getElementById('spellingMode').style.display = 'none';
            document.getElementById('meaningMode').style.display = 'none';
            document.getElementById('statsArea').style.display = 'none';

            document.getElementById('feedbackArea').classList.remove('show', 'success', 'error');
            document.getElementById('feedbackArea2').classList.remove('show', 'success', 'error');
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('selected', 'correct', 'incorrect');
            });
            selectedOption = null;

            // 重新开始练习
            setTimeout(() => {
                startPractice();
            }, 300);
        }

        // 监听键盘事件

// 页面加载时应用保存的主题
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const themeIcon = document.getElementById('themeIcon');
            
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                if (themeIcon) {
                    themeIcon.innerHTML = '<use href="assets/icons.svg#icon-sun"></use>';
                }
            } else {
                if (themeIcon) {
                    themeIcon.innerHTML = '<use href="assets/icons.svg#icon-moon"></use>';
                }
            }
        })();

                document.addEventListener('DOMContentLoaded', function() {

                    // 初始化主题

                    

        

                    // 页面加载时自动开始练习

                    setTimeout(() => {

                        startPractice();

                    }, 500);

        

                    // 监听键盘输入

                    document.addEventListener('keydown', function(e) {

                        // 如果在暂停页面，按任意键继续

                        if (document.getElementById('pauseArea').style.display !== 'none' &&

                            !e.ctrlKey && !e.altKey && !e.metaKey) {

                            document.getElementById('pauseArea').style.display = 'none';

                            document.getElementById('spellingMode').style.display = 'block';
                            document.getElementById('meaningMode').style.display = 'none';

                            isPaused = false;

                            e.preventDefault();

                        }

                        // 如果正在练习，监听字母输入

                        else if (isStarted && !isPaused && currentMode === 'spelling') {

                            const wordData = wordList[currentWordIndex];

                            const currentWordEl = document.getElementById('currentWord');

                            const letters = currentWordEl.querySelectorAll('.word-letter');

        

                            // 处理字母输入

                            if (e.key.length === 1 && e.key.match(/[a-zA-Z]/)) {

                                e.preventDefault();

                                const currentIndex = currentInput.length;

        

                                if (currentIndex < wordData.word.length) {

                                    currentInput += e.key.toLowerCase();

                                    const inputChar = currentInput[currentIndex];

                                    const targetChar = wordData.word[currentIndex].toLowerCase();

        

                                    // 检查字母是否正确

                                    if (inputChar === targetChar) {

                                        letters[currentIndex].classList.add('correct');

                                    } else {

                                        letters[currentIndex].classList.add('incorrect');

                                    }

        

                                    // 移除当前活动状态

                                    letters.forEach(letter => letter.classList.remove('active'));

        

                                    // 设置下一个字母为活动状态

                                    if (currentIndex + 1 < wordData.word.length) {

                                        letters[currentIndex + 1].classList.add('active');

                                    }

        

                                    // 检查是否完成输入

                                    if (currentInput.length === wordData.word.length) {

                                        checkAnswer();

                                    }

                                }

                            }

                            // 处理退格键

                            else if (e.key === 'Backspace') {

                                e.preventDefault();

                                if (currentInput.length > 0) {

                                    currentInput = currentInput.slice(0, -1);

                                    const currentIndex = currentInput.length;

                                    letters[currentIndex].classList.remove('incorrect', 'correct');

        

                                    // 移除当前活动状态

                                    letters.forEach(letter => letter.classList.remove('active'));

        

                                    // 设置当前字母为活动状态

                                    letters[currentIndex].classList.add('active');

                                }

                            }

                        }

                    });

        

                    // 监听页面可见性变化（浏览器切换/最小化）

                    document.addEventListener('visibilitychange', function() {

                        if (document.hidden && isStarted && !isPaused) {

                            // 页面隐藏，暂停练习

                            isPaused = true;

                            document.getElementById('spellingMode').style.display = 'none';
                            document.getElementById('meaningMode').style.display = 'none';

                            document.getElementById('pauseArea').style.display = 'block';

                        } else if (!document.hidden && isPaused) {

                            // 页面显示，显示暂停提示

                            document.getElementById('pauseArea').style.display = 'block';

                        }

                    });

        

                    // 监听窗口失去焦点

                    window.addEventListener('blur', function() {

                        if (isStarted && !isPaused) {

                            isPaused = true;

                            document.getElementById('spellingMode').style.display = 'none';
                            document.getElementById('meaningMode').style.display = 'none';

                            document.getElementById('pauseArea').style.display = 'block';

                        }

                    });

        

                    // 监听窗口获得焦点

                    window.addEventListener('focus', function() {

                        if (isPaused) {

                            document.getElementById('pauseArea').style.display = 'block';

                        }

                    });

                });

        function selectOption(btn) {
            document.querySelectorAll('.option-btn').forEach(b => {
                b.classList.remove('selected');
            });
            btn.classList.add('selected');
            selectedOption = btn;
        }

        function checkMeaning() {
            const feedback = document.getElementById('feedbackArea2');

            if (selectedOption) {
                // 模拟检查答案（假设第二个选项是正确的）
                if (selectedOption.textContent.includes('顿悟')) {
                    selectedOption.classList.add('correct');
                    feedback.classList.add('show', 'success');
                    feedback.querySelector('.feedback-text').textContent = '回答正确！';
                } else {
                    selectedOption.classList.add('incorrect');
                    feedback.classList.add('show', 'error');
                    feedback.querySelector('.feedback-text').textContent = '回答错误';
                }
            }
        }
        
        // 监听localStorage变化，实现跨页面主题同步
        window.addEventListener('storage', function(e) {
            if (e.key === 'theme') {
                const themeIcon = document.getElementById('themeIcon');
                if (e.newValue === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    if (themeIcon) {
                        themeIcon.innerHTML = '<use href="assets/icons.svg#icon-sun"></use>';
                    }
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    if (themeIcon) {
                        themeIcon.innerHTML = '<use href="assets/icons.svg#icon-moon"></use>';
                    }
                }
            }
        });
    </script>
</body>
